<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature Forge</title>
<style>
:root{--bg:#14151a;--panel:#1c1e25;--line:#2c2f3a;--text:#e6e6ea;--muted:#9a9aa6;--accent:#d9a441;--ok:#5fb37a}
@media (prefers-color-scheme:light){:root{--bg:#f6f4ef;--panel:#fff;--line:#d9d5ca;--text:#1d1d22;--muted:#6c6c78;--accent:#9a6a00;--ok:#2e7d4f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;display:flex;height:100vh}
#side{width:340px;min-width:260px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#side header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#side header b{flex:1;font-size:16px}
#q{margin:8px 12px 4px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
#filters{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 8px}
#list{overflow:auto;flex:1}
.card{padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.card:hover{background:rgba(127,127,127,.12)}.card.on{background:rgba(217,164,65,.18)}
.card .t{display:flex;justify-content:space-between;gap:8px}.card .t span:first-child{font-weight:600}
.card small{color:var(--muted)}
.chip{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.Done{color:var(--ok);border-color:var(--ok)}.chip.Building,.chip.Filed{color:var(--accent);border-color:var(--accent)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#top .path{flex:1;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.on,button.primary{border-color:var(--accent);color:var(--accent)}
#body{flex:1;display:flex;min-height:0}
#tree{width:210px;border-right:1px solid var(--line);overflow:auto;padding:6px 0;display:none}
.f{padding:4px 14px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.f:hover{background:rgba(127,127,127,.12)}.f.on{color:var(--accent);background:rgba(217,164,65,.18)}.f small{color:var(--muted)}
#view{flex:1;overflow:auto;padding:20px 28px;max-width:880px}
#view table{border-collapse:collapse}#view td,#view th{border:1px solid var(--line);padding:4px 8px}
#edit{flex:1;display:none;border:0;padding:20px 28px;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,monospace;resize:none;outline:none}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.row .id{font-family:ui-monospace,monospace;color:var(--muted);min-width:42px}.row.done .ti{text-decoration:line-through;color:var(--muted)}
.row small{color:var(--muted)}.tag{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-left:4px}
.hit{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.hit small{color:var(--muted);display:block}
form.nf{display:flex;flex-direction:column;gap:8px;max-width:620px}
form.nf input,form.nf textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}
form.nf textarea{min-height:180px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;opacity:0;pointer-events:none}
#toast.show{animation:fade 4s forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#grill{width:430px;min-width:340px;border-left:1px solid var(--line);background:var(--panel);display:none;flex-direction:column}
#grill header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#grill header b{flex:1;font-size:13px}
#gt{flex:1;overflow:auto;padding:10px 12px;font-size:14px}
.gm{margin:0 0 12px;padding:8px 10px;border-radius:8px;white-space:pre-wrap;border:1px solid var(--line)}
.gm.me{background:rgba(217,164,65,.12)}.gm.sys{color:var(--muted);font-size:12px;border:0;padding:2px 0}
#gin{border-top:1px solid var(--line);padding:8px;display:none;flex-direction:column;gap:6px}
#gtext{width:100%;min-height:72px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit}
#gin .row2{display:flex;gap:6px;flex-wrap:wrap}
.repo-opt{padding:6px 0;border-bottom:1px solid var(--line)}.repo-opt small{color:var(--muted);display:block}
#prop{border-top:1px solid var(--line);padding:8px;display:none;max-height:40%;overflow:auto;font-size:13px}
.pop{padding:4px 0;border-bottom:1px solid var(--line)}.pop.bad{color:var(--muted)}
.pieces{list-style:none;margin:8px 0 0;padding:0}.piece{display:flex;gap:6px;align-items:baseline;padding:2px 0;font-size:13px}.piece.done b{color:var(--ok)}.piece b{font-family:ui-monospace,monospace;min-width:34px;color:var(--muted)}.piece.done .pt{color:var(--muted)}.tag.need{color:var(--accent);border-color:var(--accent)}.tag.merged{color:var(--ok);border-color:var(--ok)}
.row .acts{margin-left:auto;text-align:right}.warn{color:var(--accent)}.row .acts button{margin-left:4px}.row .acts small{display:block}.tag.lock{color:var(--accent);border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}.board h3{margin:0 0 4px;font-size:14px;color:var(--muted)}
.bcard{border:1px solid var(--line)!important;border-radius:8px;margin:6px 0;background:var(--panel)}.bcard small{color:var(--muted);display:block}
.grp{margin:0 0 18px}.grp h3{margin:0 0 4px}.grp .card{border:1px solid var(--line);border-radius:8px;margin:4px 0}
.graph text{fill:var(--text);font:12px system-ui,sans-serif}.graph .gn rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.graph .gn.done rect{stroke:var(--ok)}.graph .gn.filed rect{stroke:var(--accent)}.graph .edge{fill:none;stroke:var(--muted);stroke-width:1.5}.graph .arrow{fill:var(--muted)}
form.rf{display:flex;flex-direction:column;gap:8px;max-width:620px}
form.rf select,form.rf input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}
</style></head><body>
<div id="side">
  <header><b>Feature Forge</b><button id="bNew" class="primary" title="Describe a new feature">+ New</button><button id="bRefresh" title="Reload the library">Refresh</button></header>
  <div style="display:flex;gap:6px;padding:6px 12px 0"><button id="bBoard" title="Every item of every feature in three columns">Board</button><button id="bRepos" title="Features grouped by the repo they are built in">By repo</button></div>
  <input id="q" placeholder="Search every feature (press Enter)">
  <div id="filters"></div>
  <div id="list"></div>
</div>
<div id="main">
  <div id="top"><span class="path" id="path">Pick a feature, or create one.</span>
    <button id="bRepo" style="display:none" title="Which repo is this feature built in?">Choose repo</button><button id="bGrill" class="primary" style="display:none" title="Interview me about this feature">&#128293; Grill</button><button id="bGraph" style="display:none" title="The dependency graph of this feature">Graph</button><button id="bView" class="on" style="display:none">View</button><button id="bEdit" style="display:none">Edit</button><button id="bSave" class="primary" style="display:none">Save</button></div>
  <div id="body"><div id="tree"></div><div id="view"></div><textarea id="edit" spellcheck="false"></textarea></div>
</div>
<div id="grill">
  <header><b id="gtitle">Grill</b><button id="gclose" title="Hide the panel (the session keeps running)">Hide</button></header>
  <div id="gt"></div>
  <div style="padding:8px"><button id="gstart" class="primary">Start the interview</button></div>
  <div id="gin"><textarea id="gtext" placeholder="Your answers (Ctrl+Enter sends)"></textarea>
    <div class="row2"><button id="gsend" class="primary">Send</button><button id="gsave" title="Append this conversation to interview.md">Save to interview</button><button id="grev" title="Read the newest checklist proposal in this conversation">Review proposal</button><button id="gend" title="End the session (press twice if it is unsaved)">End</button></div></div>
  <div id="prop"></div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const STATUSES=['Grilling','Planned','Filed','Building','Done'];
let features=[],filter='All',cur=null,curPath=null,editing=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const post=(url,body,method)=>api(url,{method:method||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

function renderFilters(){
  const counts={All:features.length};STATUSES.forEach(s=>counts[s]=features.filter(f=>f.status===s).length);
  $('filters').innerHTML=['All',...STATUSES].map(s=>`<button data-f="${s}" class="${s===filter?'on':''}">${s} ${counts[s]}</button>`).join('');
}
function renderList(){
  const rows=features.filter(f=>filter==='All'||f.status===filter);
  $('list').innerHTML=rows.length?rows.map(f=>{const pct=f.total?Math.round(100*f.ticked/f.total):0;
    return `<div class="card ${f.slug===cur?'on':''}" data-s="${esc(f.slug)}"><div class="t"><span>${esc(f.title)}</span><span class="chip ${f.status}">${f.status}</span></div>
    <small>${f.ticked}/${f.total} done${f.repo?' · '+esc(f.repo):''}</small><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')
    :'<div class="card"><small>No features in this view.</small></div>';
}
async function loadLibrary(){features=await api('/api/features');renderFilters();renderList()}

function clearMain(){$('view').style.maxWidth='';$('view').style.display='block';$('edit').style.display='none';editing=false}
function showButtons(on){['bRepo','bGrill','bGraph','bView','bEdit'].forEach(b=>$(b).style.display=on?'':'none');$('bSave').style.display='none'}
let lintArmed=new Set(),taskStates={};
function piecesHtml(i){if(!(i.pieces||[]).length)return '';
  return '<ul class="pieces">'+i.pieces.map(p=>{const m=p.meta||{};
    return `<li class="piece ${p.ticked?'done':''}" data-piece="${esc(p.id)}"><input type="checkbox" disabled ${p.ticked?'checked':''}><b>${esc(p.id)}</b><span class="pt">${esc(p.title)}</span>${m.merged?`<span class="tag merged">merged ${esc(m.merged)}</span>`:''}${m.task?`<span class="tag" title="The Agent Manager task for this piece">task ${esc(m.task)}${(taskStates[i.id+'/'+p.id]||{}).state?' · '+esc(taskStates[i.id+'/'+p.id].state):''}</span>`:''}${m.needs?`<span class="tag need">needs: ${esc(m.needs)}</span>`:''}</li>`}).join('')+'</ul>'}
function actionsHtml(i){const m=i.meta||{};let h='';
  if(!i.ticked){
    h+=`<button data-flag="premium" data-id="${esc(i.id)}" data-val="${m.premium==='true'?'false':'true'}" title="Premium puts the task at the front of the queue">${m.premium==='true'?'Premium: on':'Premium: off'}</button>`;
    if(!i.locked)h+=`<button data-flag="cloud" data-id="${esc(i.id)}" data-val="${m.cloud==='true'?'false':'true'}" title="Cloud sends the task to the Sonnet cloud lane">${m.cloud==='true'?'Cloud: on':'Cloud: off'}</button>`;
    if(!i.locked||i.pieceUnfiled>0){const armed=lintArmed.has(i.id);
      h+=`<button class="primary" data-file="${esc(i.id)}" title="${i.pieceTotal?'Queue each unfiled piece as its own Agent Manager task, in order':'Queue this item as an Agent Manager task'}">${armed?'File anyway':'File'}</button>`;
      if(i.lint&&i.lint.length)h+=`<br><small class="warn">Polling language: ${esc(i.lint.join(', '))}. Reword it to use a trigger${armed?', or press File anyway':''}.</small>`}
    else if(m.task)h+=`<br><small>task ${esc(m.task)}${taskStates[i.id]?' · '+esc(taskStates[i.id].state):''}</small>`}
  return h+`<button data-grill="${esc(i.id)}" title="Interview me about just this item">Grill</button>`}
function checklistHtml(items){
  if(!items.length)return '<p><small>No checklist items yet.</small></p>';
  return items.map(i=>{const m=i.meta||{};
    return `<div class="row ${i.ticked?'done':''}" data-item="${esc(i.id)}"><input type="checkbox" disabled ${i.ticked?'checked':''}><span class="id">${esc(i.id)}</span>
    <span class="ti">${esc(i.title)}${m.premium==='true'?'<span class="tag">premium</span>':''}${m.cloud==='true'?'<span class="tag">cloud</span>':''}${i.locked?'<span class="tag lock">filed</span>':''}${m.took?`<span class="tag">took ${esc(m.took)} min</span>`:''}${m.changed?`<span class="tag">changed since filing ${esc(m.changed)}</span>`:''}${m.manual==='true'?'<span class="tag">ticked by hand</span>':''}
    ${i.pieceTotal?`<span class="tag" title="Sub-pieces done / total">${i.pieceDone}/${i.pieceTotal} pieces</span>`:''}${(i.deps||[]).length?`<br><small>after ${esc(i.deps.join(', '))}</small>`:''}${i.body?`<br><small>${esc(i.body)}</small>`:''}${piecesHtml(i)}</span>
    <span class="acts">${actionsHtml(i)}</span></div>`}).join('');
}
async function openFeature(slug,path){
  cur=slug;renderList();clearMain();showButtons(true);$('tree').style.display='block';refreshRepo().catch(()=>{});
  const tree=await api(`/api/features/${slug}/tree`);
  $('tree').innerHTML=tree.map(t=>`<div class="f" data-p="${esc(t.path)}"><span>${esc(t.path)}</span><small>${t.words}</small></div>`).join('');
  await openFile(path||(tree.find(t=>t.path==='checklist.md')?'checklist.md':tree[0]&&tree[0].path))
}
async function openFile(path){
  if(!cur||!path)return;curPath=path;clearMain();
  $('path').textContent=`${cur}/${path}`;$('bView').className='on';$('bEdit').className='';$('bSave').style.display='none';
  document.querySelectorAll('#tree .f').forEach(e=>e.classList.toggle('on',e.dataset.p===path));
  if(path==='checklist.md'){
    try{const r=await post(`/api/features/${cur}/sync`,{});taskStates=r.states||{};if(r.ticked&&r.ticked.length){toast('Merged: '+r.ticked.join(', '));loadLibrary().catch(()=>{})}}catch(e){taskStates={}}
    $('view').innerHTML=checklistHtml(await api(`/api/features/${cur}/checklist`));return}
  const r=await api(`/api/features/${cur}/render?path=${encodeURIComponent(path)}`);$('view').innerHTML=r.html;
}
async function startEdit(){
  if(!cur||!curPath)return;const f=await api(`/api/features/${cur}/file?path=${encodeURIComponent(curPath)}`);
  $('edit').value=f.text;$('view').style.display='none';$('edit').style.display='block';editing=true;
  $('bView').className='';$('bEdit').className='on';$('bSave').style.display='';
}
async function save(){
  try{await post(`/api/features/${cur}/file?path=${encodeURIComponent(curPath)}`,{text:$('edit').value},'PUT');toast('Saved');await loadLibrary();await openFeature(cur,curPath)}
  catch(e){toast('Save failed: '+e.message)}
}
function newForm(){
  cur=null;curPath=null;renderList();showButtons(false);$('tree').style.display='none';clearMain();$('path').textContent='New feature';
  $('view').innerHTML=`<form class="nf" id="nf"><h2>New feature</h2><input id="nt" placeholder="Title" required>
    <textarea id="nr" placeholder="What do you want built? Name the repo if you know it (a line 'repo: name' is picked up)."></textarea>
    <div><button class="primary" type="submit">Create</button></div></form>`;
  $('nf').onsubmit=async ev=>{ev.preventDefault();
    try{const r=await post('/api/features',{title:$('nt').value,request:$('nr').value});await loadLibrary();await openFeature(r.slug)}catch(e){toast(e.message)}};
}
async function runSearch(){
  const q=$('q').value.trim();if(!q)return;cur=null;renderList();showButtons(false);$('tree').style.display='none';clearMain();$('path').textContent=`Search: ${q}`;
  const hits=await api('/api/search?q='+encodeURIComponent(q));
  $('view').innerHTML=hits.length?hits.map(h=>`<div class="hit" data-s="${esc(h.slug)}" data-p="${esc(h.path)}"><b>${esc(h.slug)}/${esc(h.path)}</b><small>${esc(h.snippet)}</small></div>`).join(''):'<p><small>No matches.</small></p>';
}
document.addEventListener('click',async ev=>{
  const gb=ev.target.closest('[data-grill]');if(gb){itemGrill(gb.dataset.grill);return}
  const fb=ev.target.closest('[data-file]'),pb=ev.target.closest('[data-flag]');
  if(fb||pb){try{
    if(pb){await post(`/api/features/${cur}/checklist/${pb.dataset.id}/flag`,{flag:pb.dataset.flag,value:pb.dataset.val==='true'})}
    else{const id=fb.dataset.file,row=(await api(`/api/features/${cur}/checklist`)).find(r=>r.id===id);
      if(row&&row.lint.length&&!lintArmed.has(id)){lintArmed.add(id);await openFile('checklist.md');return}
      const r=await post(`/api/features/${cur}/checklist/${id}/file`,{acceptLint:lintArmed.has(id)});lintArmed.delete(id);
      const made=(r.pieces&&r.pieces.length)?r.pieces.map(x=>x.piece+' '+x.task).join(', '):r.task;const pe=r.premiumError||(r.pieces||[]).map(x=>x.premiumError).find(Boolean);
      toast(`Filed ${id} as ${made}${pe?' (premium not set: '+pe+')':''}`);await loadLibrary()}
    await openFile('checklist.md')}catch(e){toast(e.message)}return}
  const t=ev.target.closest('[data-f],[data-s],[data-p],a[data-md]');if(!t)return;
  try{
    if(t.dataset.f){filter=t.dataset.f;renderFilters();renderList()}
    else if(t.matches('a[data-md]')){ev.preventDefault();await openFile(t.dataset.md)}
    else if(t.classList.contains('hit'))await openFeature(t.dataset.s,t.dataset.p);
    else if(t.classList.contains('card')&&t.dataset.s)await openFeature(t.dataset.s);
    else if(t.classList.contains('f'))await openFile(t.dataset.p);
  }catch(e){toast(e.message)}
});
$('q').addEventListener('keydown',ev=>{if(ev.key==='Enter')runSearch().catch(e=>toast(e.message))});
$('bNew').onclick=newForm;$('bRefresh').onclick=()=>loadLibrary().then(()=>{if(cur&&!editing)openFeature(cur,curPath)}).catch(e=>toast(e.message));
$('bView').onclick=()=>openFile(curPath).catch(e=>toast(e.message));$('bEdit').onclick=()=>startEdit().catch(e=>toast(e.message));$('bSave').onclick=save;
/* ---- views: board, by repo, graph (read-only, computed when asked) ---- */
function plainView(title){cur=null;curPath=null;renderList();showButtons(false);$('tree').style.display='none';clearMain();$('path').textContent=title;$('view').style.maxWidth='none'}
async function showBoard(){plainView('Board');const cols=(await api('/api/views/board')).columns;
  $('view').innerHTML='<div class="board">'+['Not filed','In flight','Done'].filter(n=>cols[n]).map(name=>`<div class="col" data-col="${esc(name)}"><h3>${esc(name)} (${cols[name].length})</h3>`
    +(cols[name].map(c=>`<div class="card bcard" data-s="${esc(c.slug)}"><b>${esc(c.id)}</b> ${esc(c.title)}${c.premium?'<span class="tag">premium</span>':''}${c.cloud?'<span class="tag">cloud</span>':''}${c.took?`<span class="tag">took ${esc(c.took)} min</span>`:''}<small>${esc(c.feature)}${c.repo?' · '+esc(c.repo):''}</small></div>`).join('')||'<small>Nothing here.</small>')+'</div>').join('')+'</div>'}
async function showRepos(){plainView('By repo');const groups=await api('/api/views/repos');
  $('view').innerHTML=groups.length?groups.map(g=>`<div class="grp" data-repo="${esc(g.repo)}"><h3>${esc(g.repo||'(no repo yet)')} <small>${g.ticked}/${g.total} done</small></h3>`
    +g.features.map(f=>`<div class="card" data-s="${esc(f.slug)}"><div class="t"><span>${esc(f.title)}</span><span class="chip ${f.status}">${f.status}</span></div><small>${f.ticked}/${f.total} done</small></div>`).join('')+'</div>').join(''):'<p><small>No features yet.</small></p>'}
async function showGraph(){if(!cur)return;const svg=await (await fetch(`/api/features/${cur}/graph.svg`)).text();clearMain();$('view').style.maxWidth='none';$('path').textContent=`${cur}: graph`;
  $('view').innerHTML=`<p><small>Green outline: done. Amber: filed. Grey: not filed. Arrows point from a dependency to the item that waits for it.</small></p>`+svg}
$('bBoard').onclick=()=>showBoard().catch(e=>toast(e.message));$('bRepos').onclick=()=>showRepos().catch(e=>toast(e.message));$('bGraph').onclick=()=>showGraph().catch(e=>toast(e.message));
/* ---- repo intake: the owner decides; the grill recommends in its first question ---- */
async function refreshRepo(){
  if(!cur)return;const r=await api(`/api/features/${cur}/repo`);
  $('bRepo').textContent=r.name?`Repo: ${r.name}${r.exists?'':' (new)'}`:'Choose repo';return r}
async function repoChooser(){
  if(!cur)return;const repos=await api('/api/repos'),now=await api(`/api/features/${cur}/repo`);clearMain();$('path').textContent=`${cur}: repo`;
  $('view').innerHTML=`<form class="rf" id="rf"><h2>Which repo is this built in?</h2>
    <p><small>The interview recommends an existing repo or a new one in its first question. The decision is yours.${now.name?` Now: <b>${esc(now.name)}</b>${now.exists?'':' (new, not created yet)'}.`:''}</small></p>
    <label>Existing repo<select id="rsel"><option value="">(none)</option>${repos.map(r=>`<option value="${esc(r.name)}"${r.name===now.name?' selected':''}>${esc(r.name)}${r.summary?' - '+esc(r.summary):''}</option>`).join('')}</select></label>
    <label>or a new repo name<input id="rnew" placeholder="e.g. my-new-tool"></label>
    <div><button class="primary" type="submit">Use this repo</button></div></form>`;
  if(now.name&&!now.exists)repoCreateBox(now.name);
  $('rf').onsubmit=async ev=>{ev.preventDefault();const name=$('rnew').value.trim()||$('rsel').value;if(!name){toast('Pick a repo or type a new name');return}
    try{await post(`/api/features/${cur}/repo`,{name});toast('Repo set: '+name);await refreshRepo();await openFile('request.md')}catch(e){toast(e.message)}}}
/* Create repo: the first press shows the steps, the second press (Create now) does them. No dialog. */
function repoCreateBox(name){
  $('view').insertAdjacentHTML('beforeend',`<div id="rcreate"><h3>${esc(name)} does not exist yet</h3><button id="rcplan" class="primary">Create repo</button><div id="rcsteps"></div></div>`);
  $('rcplan').onclick=async()=>{try{
    const p=await api(`/api/repos/plan?name=${encodeURIComponent(name)}`);
    $('rcsteps').innerHTML='<p><small>These steps will run, in this order:</small></p><ol>'+p.steps.map(s=>`<li class="rstep" data-step="${esc(s.id)}">${esc(s.text)}${s.done?' <small>(already done)</small>':''}</li>`).join('')+'</ol><button id="rcgo" class="primary">Create now</button>';
    $('rcgo').onclick=async()=>{$('rcgo').disabled=true;try{
      const r=await post('/api/repos/create',{name,confirm:true});
      $('rcsteps').innerHTML='<ol>'+r.steps.map(s=>`<li class="rstep" data-step="${esc(s.id)}">${esc(s.text)} <b>${esc(s.result)}</b></li>`).join('')+'</ol>';
      toast('Repo created: '+name);await refreshRepo()}catch(e){toast(e.message);$('rcgo').disabled=false}}}catch(e){toast(e.message)}}}
$('bRepo').onclick=()=>repoChooser().catch(e=>toast(e.message));

/* ---- grill panel ---- */
let G=null,gUnsaved=false,gEnding=false,gNode='feature';
function gadd(cls,text){const d=document.createElement('div');d.className='gm '+cls;d.textContent=text;$('gt').appendChild(d);$('gt').scrollTop=1e9;return d}
function gReset(){$('prop').style.display='none';$('prop').innerHTML='';G=null;gUnsaved=false;gEnding=false;$('gt').innerHTML='';$('gin').style.display='none';$('gstart').parentElement.style.display=''}
function itemGrill(id){
  if(!cur)return;if(G&&(G.slug!==cur||G.node!==id)){gToast();return}
  gNode=id;openGrill()}
function gToast(){toast('End the current grill session first (Save to interview, then End)')}
function openGrill(){
  if(!cur){toast('Open a feature first');return}
  if(G&&G.slug!==cur)gReset();
  $('grill').style.display='flex';$('gtitle').textContent=`Grill: ${cur}${gNode!=='feature'?' / '+gNode:''}`;
  if(!G&&!$('gt').children.length)gadd('sys','Starts an interview about this feature. The model can read the repos but cannot change anything. Nothing is saved until you press "Save to interview".')}
async function gstream(url,body){
  const bub=gadd('','');$('gsend').disabled=true;
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||r.status)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const fr=buf.slice(0,i);buf=buf.slice(i+2);
        for(const ln of fr.split('\n')){if(!ln.startsWith('data:'))continue;let ev;try{ev=JSON.parse(ln.slice(5))}catch{continue}
          if(ev.type==='chunk'){bub.textContent+=ev.text;$('gt').scrollTop=1e9}
          else if(ev.type==='error')gadd('sys','Error: '+ev.error)}}}
    if(!bub.textContent)bub.textContent='(no reply)';gUnsaved=true;
  }catch(e){bub.className='gm sys';bub.textContent='Error: '+e.message}
  $('gsend').disabled=false}
$('bGrill').onclick=()=>{if(!G)gNode='feature';openGrill()};
$('gclose').onclick=()=>{$('grill').style.display='none'};
$('gstart').onclick=async()=>{
  try{$('gstart').disabled=true;const m=await post('/api/grill/start',{feature:cur,node:gNode});
    G={sid:m.id,slug:cur,node:gNode};$('gstart').parentElement.style.display='none';$('gin').style.display='flex';
    gadd('sys','Session started. Waiting for the first round...');await gstream(`/api/grill/${G.slug}/${G.sid}/begin`);
  }catch(e){gadd('sys','Could not start: '+e.message)}finally{$('gstart').disabled=false}};
$('gsend').onclick=async()=>{const t=$('gtext').value.trim();if(!t||!G)return;$('gtext').value='';gadd('me',t);await gstream(`/api/grill/${G.slug}/${G.sid}/message`,{message:t})};
$('gtext').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')$('gsend').click()});
$('gsave').onclick=async()=>{if(!G)return;
  try{const r=await post(`/api/grill/${G.slug}/${G.sid}/save`,{});gUnsaved=false;gadd('sys',`Saved ${r.words} words to ${r.path}`);await loadLibrary();if(cur===G.slug)await openFeature(cur,'interview.md')}
  catch(e){gadd('sys','Save failed: '+e.message)}};
$('gend').onclick=async()=>{if(!G)return;
  if(gUnsaved&&!gEnding){gEnding=true;gadd('sys','Not saved yet. Press End again to discard, or Save to interview first.');return}
  await post(`/api/grill/${G.slug}/${G.sid}/end`,{}).catch(()=>{});gReset();gNode='feature';gadd('sys','Session ended.')};
/* ---- proposal review: the model proposes checklist changes, the owner ticks which to apply ---- */
let PROP=null;
function showProp(){
  const box=$('prop');box.style.display='block';
  box.innerHTML='<b>Proposed checklist changes</b>'+PROP.proposal.ops.map((op,n)=>{const r=PROP.preview[n]||{};
    return `<label class="pop ${r.ok?'':'bad'}" data-op="${n}"><input type="checkbox" ${r.ok?'checked':'disabled'}> ${esc(r.summary||op.op)}${r.ok?'':' (refused)'}</label>`}).join('')
    +'<div class="row2" style="margin-top:6px"><button id="gapply" class="primary">Apply selected</button></div>';
  $('gapply').onclick=applyProp}
async function applyProp(){
  const only=[...document.querySelectorAll('#prop .pop')].filter(l=>l.querySelector('input').checked).map(l=>+l.dataset.op);
  if(!only.length){toast('Nothing selected');return}
  try{await post(`/api/features/${G.slug}/checklist/apply`,{proposal:PROP.proposal,only});PROP=null;$('prop').style.display='none';
    gadd('sys','Checklist updated.');await loadLibrary();if(cur===G.slug)await openFeature(cur,'checklist.md')}
  catch(e){gadd('sys','Apply failed: '+e.message)}}
$('grev').onclick=async()=>{if(!G)return;
  try{PROP=await post(`/api/grill/${G.slug}/${G.sid}/proposal`,{});showProp()}catch(e){gadd('sys',e.message)}};
loadLibrary().catch(e=>toast(e.message));
</script></body></html>
